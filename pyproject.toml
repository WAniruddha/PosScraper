[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-scraper"
version = "0.1.0"
description = "Personal career opportunity intelligence system for engineering jobs, PhDs, and research positions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aniruddha Wadekar" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]

[project.scripts]
pos-scraper = "pos_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
